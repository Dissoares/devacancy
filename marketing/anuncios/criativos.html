<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criativos Devacancy — Facebook / Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
  /*
    Renderizado por marketing/anuncios/gerar.js. Abra com ?c=a|b|c e &f=feed|story para ver uma peça.
    feed = 1080x1350 (4:5), story = 1080x1920 (9:16, com as zonas seguras de Stories/Reels livres).
  */
  :root {
    --fundo-1: #0a1020;
    --fundo-2: #1e40af;
    --azul: #3b82f6;
    --azul-claro: #93c5fd;
    --laranja-1: #fb923c;
    --laranja-2: #ea580c;
    --verde: #22c55e;
    --texto: #ffffff;
    --suave: #cbd5e1;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; background: #000; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .peca {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 72px 76px 64px;
    color: var(--texto);
    background:
      radial-gradient(900px 700px at 100% 0%, rgba(96, 165, 250, .32), transparent 60%),
      radial-gradient(700px 600px at 0% 100%, rgba(249, 115, 22, .22), transparent 60%),
      linear-gradient(165deg, var(--fundo-1) 0%, #11235e 55%, var(--fundo-2) 100%);
  }
  .peca.story { height: 1920px; padding-top: 250px; padding-bottom: 340px; }

  /* Marca */
  .marca { display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: 44px; letter-spacing: -.02em; }
  .marca svg { width: 64px; height: 64px; }
  .marca b { color: var(--azul-claro); font-weight: 800; }

  /* Títulos */
  h1 { margin-top: 46px; font-size: 88px; line-height: 1.05; font-weight: 800; letter-spacing: -.04em; }
  .story h1 { margin-top: 56px; font-size: 92px; }
  .destaque { background: linear-gradient(90deg, var(--laranja-1), #fde047); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 26px; max-width: 920px; font-size: 37px; line-height: 1.36; font-weight: 500; color: var(--suave); }
  .story .sub { font-size: 40px; margin-top: 36px; }

  /* Cartão de vaga (réplica do produto) */
  .vagas { position: relative; flex: none; margin-top: 44px; height: var(--h-vagas, 470px); }
  .story .vagas { margin-top: 64px; height: var(--h-vagas-story, 500px); }
  .vaga {
    position: absolute; left: 0; right: 0;
    padding: 30px 34px 28px;
    border-radius: 32px;
    background: #ffffff; color: #0f172a;
    border-left: 12px solid var(--verde);
    box-shadow: 0 40px 80px -30px rgba(2, 6, 23, .75);
  }
  .vaga-topo { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .selo-vaga { display: inline-flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 800; letter-spacing: .04em; color: #15803d; text-transform: uppercase; }
  .selo-vaga i { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #dcfce7; font-style: normal; }
  .match { padding: 10px 20px; border-radius: 999px; background: #dcfce7; color: #15803d; font-weight: 800; font-size: 28px; }
  .vaga h3 { margin-top: 22px; font-size: 52px; line-height: 1.12; font-weight: 800; letter-spacing: -.02em; }
  .empresa { display: flex; align-items: center; gap: 14px; margin-top: 18px; font-size: 30px; color: #64748b; font-weight: 600; }
  .borrao { display: inline-block; width: 190px; height: 24px; border-radius: 8px; background: repeating-linear-gradient(90deg, #cbd5e1 0 10px, #e2e8f0 10px 20px); filter: blur(1.2px); }
  .dados { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 20px; font-size: 30px; font-weight: 600; color: #475569; }
  .dados .grana { color: #15803d; font-weight: 800; }
  .stack { display: flex; gap: 14px; margin-top: 26px; }
  .stack span { display: inline-flex; align-items: center; gap: 12px; padding: 10px 18px 10px 14px; border-radius: 14px; background: #f1f5f9; font-size: 27px; font-weight: 700; color: #334155; }
  .stack img { width: 34px; height: 34px; }

  /* Botão (criativo, não clicável) */
  .cta { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 34px; padding: 30px 40px; border-radius: 30px; font-size: 46px; font-weight: 800; letter-spacing: -.01em; background: linear-gradient(180deg, var(--laranja-1), var(--laranja-2)); box-shadow: 0 26px 50px -18px rgba(234, 88, 12, .85); }
  .cta svg { width: 44px; height: 44px; }
  .garantias { display: flex; justify-content: center; gap: 30px; margin-top: 26px; font-size: 28px; font-weight: 600; color: var(--suave); }
  .garantias span::before { content: '✓'; margin-right: 10px; color: var(--verde); font-weight: 800; }

  /* ---------- Criativo B: curiosidade ---------- */
  .radar { margin-top: 56px; padding: 44px 44px 40px; border-radius: 32px; background: rgba(255, 255, 255, .08); border: 2px solid rgba(255, 255, 255, .16); backdrop-filter: blur(6px); }
  .radar-linha { display: flex; align-items: center; justify-content: space-between; font-size: 38px; font-weight: 700; }
  .radar-linha em { font-style: normal; font-size: 30px; font-weight: 600; color: var(--azul-claro); }
  .radar .contador { margin-top: 20px; font-size: 190px; line-height: 1; font-weight: 800; letter-spacing: -.05em; }
  .barra { height: 22px; margin-top: 30px; border-radius: 999px; background: rgba(255, 255, 255, .14); overflow: hidden; }
  .barra span { display: block; width: 72%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--azul), var(--verde)); }
  .perfil { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }
  .perfil span { padding: 12px 24px; border-radius: 999px; background: rgba(255, 255, 255, .12); font-size: 30px; font-weight: 700; }

  /* ---------- Criativo C: dor ---------- */
  .antes-depois { position: relative; flex: none; margin-top: 40px; display: grid; gap: 12px; align-content: start; }
  .story .antes-depois { margin-top: 70px; gap: 26px; }
  .formulario { padding: 28px 38px; border-radius: 28px; background: rgba(255, 255, 255, .07); border: 2px dashed rgba(255, 255, 255, .28); }
  .formulario small { font-size: 26px; font-weight: 700; color: var(--azul-claro); letter-spacing: .04em; text-transform: uppercase; }
  .campos { display: grid; gap: 16px; margin-top: 18px; }
  .campos div { height: 38px; border-radius: 12px; background: rgba(255, 255, 255, .14); }
  .campos div:nth-child(2) { width: 82%; } .campos div:nth-child(3) { width: 64%; }
  .risco { position: absolute; left: -10px; right: -10px; top: 100px; height: 14px; border-radius: 99px; background: #ef4444; transform: rotate(-4deg); box-shadow: 0 8px 20px rgba(239, 68, 68, .5); }
  .feito { display: flex; align-items: center; gap: 28px; padding: 30px 34px; border-radius: 28px; background: #fff; color: #0f172a; box-shadow: 0 40px 80px -30px rgba(2, 6, 23, .75); border-left: 12px solid var(--verde); }
  .feito .ok { flex: none; display: grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; background: #dcfce7; color: #15803d; font-size: 50px; font-weight: 800; }
  .feito strong { display: block; font-size: 38px; font-weight: 800; letter-spacing: -.02em; }
  .feito span { font-size: 27px; font-weight: 600; color: #64748b; }
  .seta { justify-self: center; font-size: 54px; line-height: 1; color: var(--laranja-1); font-weight: 800; }

  .rodape { margin-top: auto; }
  .rodape-url { margin-top: 22px; text-align: center; font-size: 30px; font-weight: 700; color: var(--azul-claro); letter-spacing: .01em; }
</style>
</head>
<body>
<div id="raiz"></div>

<script>
  const LOGO = `<svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset=".55" stop-color="#6a8bff"/><stop offset="1" stop-color="#4cc9f0"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#g)"/><path d="m9.5 11 5 5-5 5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 21h6" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>`;
  const SETA = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
  const ico = (n) => `<img src="../../public/assets/img/stacks/${n}.svg" alt="">`;
  const marca = `<div class="marca">${LOGO}<span>dev<b>acancy</b></span></div>`;

  const vaga = (estilo, { titulo, match, local, nivel, grana, techs }) => `
    <article class="vaga" style="${estilo}">
      <div class="vaga-topo">
        <span class="selo-vaga"><i>✓</i> Vaga encontrada</span>
        <span class="match">${match}% compatível</span>
      </div>
      <h3>${titulo}</h3>
      <div class="empresa">🏢 <span class="borrao"></span> 🔒</div>
      <div class="dados"><span>📍 ${local}</span><span>💼 ${nivel}</span>${grana ? `<span class="grana">📈 ${grana}</span>` : ''}</div>
      <div class="stack">${techs.map(([n, r]) => `<span>${ico(n)}${r}</span>`).join('')}</div>
    </article>`;

  const cta = (texto) => `<div class="cta">${texto} ${SETA}</div>`;
  const garantias = `<div class="garantias"><span>Grátis para começar</span><span>Sem cartão</span></div>`;

  const pecas = {
    // A — marca: "Você programa. A gente se candidata."
    a: (story) => `
      ${marca}
      <h1>Você programa.<br><span class="destaque">A gente se candidata.</span></h1>
      <p class="sub">Responda um questionário de 1 minuto, veja as vagas de dev que combinam com você e deixe a nossa equipe enviar as candidaturas.</p>
      <div class="vagas">
        ${vaga('top: 60px; transform: rotate(2.4deg) scale(.96); opacity: .8;', { titulo: 'Desenvolvedor(a) Back-end Pleno', match: 88, local: 'Remoto', nivel: 'Pleno', grana: '', techs: [['php', 'PHP'], ['laravel', 'Laravel'], ['mysql', 'MySQL']] })}
        ${vaga('top: 0; transform: rotate(-1.6deg);', { titulo: 'Full Stack Developer', match: 94, local: 'Remoto · Brasil', nivel: 'Pleno', grana: 'até R$ 12.000', techs: [['typescript', 'TypeScript'], ['nodejs', 'Node.js'], ['react', 'React']] })}
      </div>
      <div class="rodape">${cta('Ver minhas vagas grátis')}${garantias}</div>`,

    // B — curiosidade: "Quantas vagas combinam com você?"
    b: (story) => `
      ${marca}
      <h1>Quantas vagas de dev <span class="destaque">combinam com você?</span></h1>
      <p class="sub">Descubra em 1 minuto: a gente cruza o seu perfil com as vagas abertas e mostra só as que fazem sentido.</p>
      <div class="radar">
        <div class="radar-linha"><span>🔍 Analisando vagas…</span><em>perfil + stack + salário</em></div>
        <div class="contador">?<span style="font-size:64px;font-weight:700;letter-spacing:-.02em;color:var(--azul-claro)"> vagas para você</span></div>
        <div class="barra"><span></span></div>
        <div class="perfil"><span>Back-end</span><span>Pleno</span><span>Remoto</span><span>Sua stack</span></div>
      </div>
      <div class="rodape">${cta('Descobrir agora')}${garantias}</div>`,

    // C — dor/tempo: "Cansou de preencher formulário?"
    c: (story) => `
      ${marca}
      <h1>Cansou de preencher <span class="destaque">formulário de vaga?</span></h1>
      <p class="sub">Enquanto você programa, a nossa equipe envia as suas candidaturas todos os dias.</p>
      <div class="antes-depois">
        <div class="formulario"><small>Formulário nº 38 hoje</small><div class="campos"><div></div><div></div><div></div></div><span class="risco"></span></div>
        <div class="seta">↓</div>
        <div class="feito"><span class="ok">✓</span><div><strong>Candidaturas enviadas pela equipe</strong><span>Você só acompanha e se prepara para as entrevistas</span></div></div>
      </div>
      <div class="rodape">${cta('Quero parar de perder tempo')}${garantias}</div>`,
  };

  const q = new URLSearchParams(location.search);
  const peca = q.get('c') || 'a';
  const story = (q.get('f') || 'feed') === 'story';
  document.getElementById('raiz').innerHTML = `<section class="peca ${story ? 'story' : ''}" id="peca">${pecas[peca](story)}</section>`;
</script>
</body>
</html>
